name: Register a content source / Đăng ký nguồn nội dung
description: Request a code for your store / IPTV / RSS source — Xin cấp code cho nguồn của bạn
title: "[Register] "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. Once an admin approves, the bot replies with your code right in this issue.
        Requirements: content hosted on a **public** GitHub repo, APKs on GitHub **Releases**.

        *Điền các ô dưới. Admin duyệt xong, bot sẽ trả code ngay trong issue này. Yêu cầu: nội dung ở repo GitHub public, APK ở GitHub Releases.*
  - type: dropdown
    id: type
    attributes:
      label: Source type
      description: store / iptv / rss — Loại nguồn
      options:
        - store
        - iptv
        - rss
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Display name
      description: Tên hiển thị
      placeholder: My app store
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Raw JSON link
      description: Link raw JSON
      placeholder: https://raw.githubusercontent.com/<user>/<repo>/main/store.json
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Liên hệ
      placeholder: email or @telegram
    validations:
      required: true
