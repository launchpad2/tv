name: Issue publisher code

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Validate registration and generate code
        id: prep
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const field = (label) => {
              const m = body.match(new RegExp('### ' + label + '\\s*\\n+(.+)'));
              return m ? m[1].trim() : '';
            };
            const type = field('Source type').toLowerCase();
            const name = field('Display name');
            const url = field('Raw JSON link');
            const contact = field('Contact');
            const fail = async (msg) => {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number,
                body: '❌ Could not issue a code: ' + msg + '\n\n*VI: Chưa cấp được code, xem lỗi ở trên.*'
              });
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: context.issue.number, name: 'approved'
              }).catch(() => {});
              core.setFailed(msg);
            };
            if (!['store', 'iptv', 'rss'].includes(type)) return fail('invalid source type: "' + type + '"');
            if (!name || !url) return fail('missing display name or link.');
            let json;
            try {
              const res = await fetch(url);
              if (!res.ok) throw new Error('HTTP ' + res.status);
              json = await res.json();
            } catch (e) {
              return fail('could not read JSON from the link (' + e.message + ').');
            }
            const shaOk = (s) => s == null || s === '' || (typeof s === 'string' && /^[0-9a-f]{64}$/i.test(s));
            let err = '';
            if (type === 'store') {
              if (typeof json.storeName !== 'string' || !Array.isArray(json.apps)) err = 'store.json must be {storeName, apps[]}';
              else for (const a of json.apps) {
                if (!a.packageName || !a.apkUrl || !a.version || !a.name || !a.description) {
                  err = 'app "' + (a.name || a.packageName || '?') + '" is missing name/packageName/description/apkUrl/version';
                  break;
                }
                if (!shaOk(a.sha256)) { err = 'app "' + a.name + '" has a malformed sha256 (must be 64 hex chars)'; break; }
              }
            } else if (type === 'iptv') {
              if (typeof json.name !== 'string' || !Array.isArray(json.channels)) err = 'iptv.json must be {name, channels[]}';
              else if (json.channels.some(c => !c.streamUrl)) err = 'a channel is missing streamUrl';
            } else {
              if (typeof json.name !== 'string' || !Array.isArray(json.feeds)) err = 'rss.json must be {name, feeds[]}';
              else if (json.feeds.some(f => !f.url)) err = 'a feed is missing url';
            }
            if (err) return fail('JSON does not match the schema: ' + err);
            // 6-char code, alphabet skips O/I/0/1 (easy to confuse on a TV screen);
            // 000000 is reserved for root content and can never be generated.
            const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 10 && !code; i++) {
              const c = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
              try { await github.rest.repos.getContent({ ...context.repo, path: 'codes/' + c + '.json' }); }
              catch (e) { if (e.status === 404) code = c; else throw e; }
            }
            if (!code) return fail('could not generate a code, re-apply the approved label to retry.');
            const pub = { type, name, url };
            const reg = { ...pub, owner: contact, issue: context.issue.number, createdAt: new Date().toISOString() };
            core.setOutput('code', code);
            core.setOutput('pub_b64', Buffer.from(JSON.stringify(pub, null, 2)).toString('base64'));
            core.setOutput('reg_b64', Buffer.from(JSON.stringify(reg, null, 2)).toString('base64'));

      - name: Write private registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          CODE: ${{ steps.prep.outputs.code }}
          REG_B64: ${{ steps.prep.outputs.reg_b64 }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/onehud/launchpad/contents/registry/${CODE}.json" \
            -d "{\"message\":\"Register ${CODE} (#${ISSUE})\",\"content\":\"${REG_B64}\",\"author\":{\"name\":\"unknown\",\"email\":\"unknown@gmail.com\"},\"committer\":{\"name\":\"unknown\",\"email\":\"unknown@gmail.com\"}}" > /dev/null

      - name: Publish code and close issue
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.prep.outputs.code }}
          PUB_B64: ${{ steps.prep.outputs.pub_b64 }}
        with:
          script: |
            const code = process.env.CODE;
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: 'codes/' + code + '.json',
              message: 'Add ' + code + ' (#' + context.issue.number + ')',
              content: process.env.PUB_B64,
              author: { name: 'unknown', email: 'unknown@gmail.com' },
              committer: { name: 'unknown', email: 'unknown@gmail.com' }
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: '✅ Your code: **' + code + '**\n\nUsers just enter this code on their TV. If your link changes later, open a new issue.\n\n*VI: Người dùng chỉ cần nhập code này trên TV. Sau này đổi link thì mở issue mới.*'
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number,
              state: 'closed', state_reason: 'completed'
            });
